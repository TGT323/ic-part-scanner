
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TGT IC Scanner V3.1</title>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101827;color:#eef4ff;font:15px Arial,sans-serif}
header{background:#1c2a42;text-align:center;padding:15px}
h2{margin:0 0 6px}small{color:#a9bedb}
main{max-width:750px;margin:auto;padding:12px}
section{background:#1c2a42;border-radius:12px;padding:13px;margin-bottom:12px}
.camera{position:relative;background:#000;border-radius:10px;overflow:hidden}
video{display:block;width:100%;max-height:360px;object-fit:contain}
.guide{position:absolute;left:9%;top:28%;width:82%;height:44%;border:2px solid #4be0a5;pointer-events:none}
.grid{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
button{background:#2879df;color:white;border:0;border-radius:8px;padding:12px;cursor:pointer;font-weight:bold}
button.secondary{background:#43536c}
button.danger{background:#a73542}
button:disabled{opacity:.5}
input{background:#0d1626;color:white;border:1px solid #5b7190;border-radius:7px;padding:10px;width:100%;margin:5px 0 10px}
label{display:block;color:#b9c9df;margin-top:8px}
#status{color:#80e7bb;min-height:20px;overflow-wrap:anywhere}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#0d1626;padding:10px;border-radius:8px;max-height:170px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
td,th{padding:9px 5px;border-bottom:1px solid #45546b;text-align:left;overflow-wrap:anywhere}
.pill{background:#0d1626;border-radius:8px;padding:12px}
#suggestions button{margin:3px;background:#405f8d}
</style>
</head>
<body>
<header>
<h2>TGT IC Part Scanner V3.1</h2>
<small>OCR · Samsung / SanDisk · Counting · CSV</small>
</header>
<main>
<section>
<div class="camera">
<video id="video" autoplay muted playsinline></video>
<div class="guide"></div>
</div>
<div class="grid">
<button id="start">Start Camera</button>
<button id="scan">SCAN NOW</button>
<button id="stop" class="secondary">Stop Camera</button>
</div>
<div class="grid">
<button id="next" class="secondary">Next Chip</button>
<button id="auto" class="secondary">Auto: OFF</button>
<button id="torch" class="secondary">Flashlight</button>
</div>
<label>Camera Zoom</label>
<input id="zoom" type="range" min="1" max="3" step=".1" value="1">
<p id="status">Ready. Start camera first.</p>
</section>

<section>
<h3>OCR Result</h3>
<pre id="raw">Waiting for scan...</pre>
<div id="suggestions"></div>
<label>Brand</label>
<input id="brand" placeholder="SAMSUNG / SANDISK">
<label>Part Number / Marking</label>
<input id="part" placeholder="S4LN058A01-8030 / 060681">
<label>Capacity</label>
<input id="capacity" placeholder="256G (if present)">
<div class="grid">
<button id="add">Confirm &amp; Add +1</button>
<button id="verify" class="secondary">Check Mouser</button>
</div>
<p id="verification"></p>
</section>

<section>
<div class="pill">Total Quantity: <strong id="total">0</strong></div>
<h3>Count by Part</h3>
<div style="overflow-x:auto">
<table>
<thead><tr><th>Brand</th><th>Part Number</th><th>Capacity</th><th>Qty</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
<div class="grid">
<button id="export">Export CSV</button>
<button id="undo" class="secondary">Undo Last</button>
<button id="clear" class="danger">Clear All</button>
</div>
</section>
</main>
<canvas id="canvas" hidden></canvas>
<script>
"use strict";

const WORKER="https://tgt-ic-lookup.tgreentech323.workers.dev";
const $=id=>document.getElementById(id);
const KEY="tgt_ic_v31_records";
let records=[];
try{records=JSON.parse(localStorage.getItem(KEY)||"[]");if(!Array.isArray(records))records=[]}catch(e){records=[]}

let stream=null,track=null,worker=null,busy=false,auto=false;
let timer=null,armed=true,lastText="",emptyCount=0;
let lastAdded=null,zoomValue=1;
const status=t=>$("status").textContent=t;

function normalize(s){
 return String(s||"").toUpperCase().replace(/[^A-Z0-9\-]/g,"");
}
function save(){
 localStorage.setItem(KEY,JSON.stringify(records));
 render();
}
function render(){
 const grouped=new Map();
 records.forEach(r=>{
  const key=[r.brand,r.part,r.capacity].join("|");
  if(!grouped.has(key))grouped.set(key,{...r,qty:0});
  grouped.get(key).qty++;
 });
 $("total").textContent=records.length;
 $("rows").innerHTML="";
 for(const r of grouped.values()){
  const tr=document.createElement("tr");
  [r.brand,r.part,r.capacity||"—",r.qty].forEach(v=>{
   const td=document.createElement("td");
   td.textContent=v;
   tr.appendChild(td);
  });
  $("rows").appendChild(tr);
 }
}

async function startCamera(){
 try{
  if(stream){status("Camera already running.");return}
  stream=await navigator.mediaDevices.getUserMedia({
   audio:false,
   video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}
  });
  $("video").srcObject=stream;
  await $("video").play();
  track=stream.getVideoTracks()[0];
  status("Camera ready. Position IC in green frame, then press SCAN NOW.");
 }catch(e){
  status("Camera error: "+e.message+". Allow Safari camera permission.");
 }
}
function stopCamera(){
 auto=false;
 $("auto").textContent="Auto: OFF";
 if(timer){clearInterval(timer);timer=null}
 if(stream)stream.getTracks().forEach(t=>t.stop());
 stream=null;track=null;
 $("video").srcObject=null;
 status("Camera stopped.");
}
async function initOCR(){
 if(worker)return worker;
 if(!window.Tesseract)throw Error("OCR library failed to load. Check internet.");
 status("Loading OCR engine. First time may take a while...");
 worker=await Tesseract.createWorker("eng",1,{
  logger:m=>{
   if(m.status==="loading language traineddata"||m.status==="initializing api")
    status("OCR: "+m.status+" "+Math.round((m.progress||0)*100)+"%");
  }
 });
 await worker.setParameters({tessedit_pageseg_mode:"6"});
 return worker;
}
function parseText(text){
 const lines=String(text).toUpperCase().split(/\n/).map(s=>s.trim()).filter(Boolean);
 const joined=lines.join(" ");
 let brand="";
 if(/SAMSUNG/.test(joined))brand="SAMSUNG";
 else if(/SAN\s*DISK|SANDISK/.test(joined))brand="SANDISK";
 else if(/\bMICRON\b/.test(joined))brand="MICRON";
 else if(/\bSK\s*HYNIX\b|\bHYNIX\b/.test(joined))brand="SK HYNIX";
 else if(/\bTOSHIBA\b|\bKIOXIA\b/.test(joined))brand="KIOXIA";
 else if(/\bINTEL\b/.test(joined))brand="INTEL";
 else if(/\bWINBOND\b/.test(joined))brand="WINBOND";
 else if(/\bSTMICRO\b|\bST\b/.test(joined))brand="ST";

 let capacity="";
 const cm=joined.match(/\b(\d{2,4})\s*(GB|G|TB|T)\b/);
 if(cm)capacity=cm[1]+(cm[2]==="GB"?"G":cm[2]==="TB"?"T":cm[2]);

 const candidates=[];
 for(const line of lines){
  const words=line.match(/[A-Z0-9][A-Z0-9\-]{3,}/g)||[];
  for(let token of words){
   token=normalize(token);
   if(["SAMSUNG","SANDISK","MALAYSIA","CHINA","TAIWAN","KOREA","ARM","MICRON","HYNIX","INTEL","KIOXIA","TOSHIBA"].includes(token))continue;
   if(/^\d{2,4}(G|GB|T|TB)$/.test(token))continue;
   if(/^\d{4}$/.test(token)&&token!=="060681")continue;
   if(!candidates.includes(token))candidates.push(token);
  }
 }
 let part="";
 if(brand==="SAMSUNG"){
  part=candidates.find(x=>/^S4L[NM]/.test(x))||
       candidates.find(x=>/^K[0-9A-Z]{6,}/.test(x))||"";
 }else if(brand==="SANDISK"){
  part=candidates.find(x=>/^060681$/.test(x))||
       candidates.find(x=>/^\d{5,8}$/.test(x))||"";
 }
 if(!part){
  part=candidates.find(x=>/[A-Z]/.test(x)&&/\d/.test(x)&&x.length>=6)||
       candidates.find(x=>x.length>=5)||"";
 }
 return {brand,part,capacity,candidates};
}
function updateFields(text){
 $("raw").textContent=text||"(No text detected)";
 const p=parseText(text);
 $("brand").value=p.brand;
 $("part").value=p.part;
 $("capacity").value=p.capacity;
 $("verification").textContent="";
 const area=$("suggestions");
 area.innerHTML="";
 if(p.candidates.length){
  const heading=document.createElement("div");
  heading.textContent="Possible markings (tap to select):";
  area.appendChild(heading);
  p.candidates.slice(0,12).forEach(v=>{
   const b=document.createElement("button");
   b.textContent=v;
   b.onclick=()=>{$("part").value=v};
   area.appendChild(b);
  });
 }
 return p;
}
function addRecord(){
 const brand=normalize($("brand").value);
 const part=normalize($("part").value);
 const capacity=normalize($("capacity").value);
 if(!brand||!part){
  status("Please confirm Brand and Part Number before adding.");
  return false;
 }
 const r={brand,part,capacity,time:new Date().toISOString()};
 records.push(r);
 lastAdded=r;
 save();
 status("Added +1: "+brand+" "+part+(capacity?" "+capacity:""));
 return true;
}
async function scan(manual=false){
 if(busy){status("OCR is still working. Please wait.");return}
 if(!stream){
  status("Start Camera first.");
  return;
 }
 const video=$("video");
 if(!video.videoWidth){status("Waiting for camera image...");return}
 busy=true;
 $("scan").disabled=true;
 try{
  await initOCR();
  status("Scanning IC markings...");
  const canvas=$("canvas");
  const ctx=canvas.getContext("2d",{willReadFrequently:true});
  const w=video.videoWidth,h=video.videoHeight;
  const cropW=Math.round(w*.82/zoomValue);
  const cropH=Math.round(h*.50/zoomValue);
  const sx=Math.round((w-cropW)/2),sy=Math.round((h-cropH)/2);
  canvas.width=Math.max(100,cropW*2);
  canvas.height=Math.max(100,cropH*2);
  ctx.drawImage(video,sx,sy,cropW,cropH,0,0,canvas.width,canvas.height);
  const result=await worker.recognize(canvas);
  const text=result.data.text||"";
  const parsed=updateFields(text);
  status(text.trim()?"Scan completed. Check fields and press Confirm & Add +1.":"No readable text. Adjust focus and lighting.");

  if(!manual&&auto){
   const key=[parsed.brand,parsed.part,parsed.capacity].join("|");
   if(!parsed.brand||!parsed.part){
    emptyCount++;
    if(emptyCount>=2){armed=true;lastText=""}
   }else{
    emptyCount=0;
    // Auto mode only pre-fills fields. Confirmation prevents wrong counts.
    if(key!==lastText){
     lastText=key;
     status("Auto detected: "+parsed.brand+" "+parsed.part+". Confirm to count.");
    }
   }
  }
 }catch(e){
  status("Scan error: "+e.message);
 }finally{
  busy=false;
  $("scan").disabled=false;
 }
}
function setAuto(){
 auto=!auto;
 $("auto").textContent=auto?"Auto: ON":"Auto: OFF";
 if(timer){clearInterval(timer);timer=null}
 if(auto){
  status("Auto OCR ON. Review result and press Confirm & Add +1 to count.");
  timer=setInterval(()=>{if(!busy&&stream)scan(false)},4500);
 }else status("Auto OCR OFF.");
}
async function toggleTorch(){
 if(!track){status("Start camera first.");return}
 try{
  const caps=track.getCapabilities?.()||{};
  if(!caps.torch){status("Flashlight not supported on this device/browser.");return}
  const on=$("torch").dataset.on!=="true";
  await track.applyConstraints({advanced:[{torch:on}]});
  $("torch").dataset.on=String(on);
 }catch(e){status("Flashlight unavailable: "+e.message)}
}
async function verifyMouser(){
 const part=normalize($("part").value);
 if(!part){status("Enter a part number first.");return}
 $("verification").textContent="Checking Mouser...";
 try{
  const res=await fetch(WORKER+"/lookup?part="+encodeURIComponent(part));
  if(!res.ok)throw Error("HTTP "+res.status);
  const data=await res.json();
  if(data.exactMatch){
   $("verification").textContent="Mouser: Exact match found.";
  }else if(data.found){
   $("verification").textContent="Mouser: Similar results only. Verify marking manually.";
  }else{
   $("verification").textContent="Mouser: No match. You may still record the chip marking.";
  }
 }catch(e){
  $("verification").textContent="Mouser unavailable: "+e.message+". Manual recording is still available.";
 }
}
function exportCSV(){
 const rows=[["Brand","Part Number / Marking","Capacity","Quantity"]];
 const grouped=new Map();
 records.forEach(r=>{
  const key=[r.brand,r.part,r.capacity].join("|");
  if(!grouped.has(key))grouped.set(key,{...r,qty:0});
  grouped.get(key).qty++;
 });
 for(const r of grouped.values())rows.push([r.brand,r.part,r.capacity,r.qty]);
 const csv="\uFEFF"+rows.map(row=>row.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\r\n");
 const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="TGT_IC_Inventory.csv";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
 status("CSV export ready.");
}
$("start").onclick=startCamera;
$("stop").onclick=stopCamera;
$("scan").onclick=()=>scan(true);
$("auto").onclick=setAuto;
$("torch").onclick=toggleTorch;
$("next").onclick=()=>{
 armed=true;lastText="";emptyCount=0;
 $("brand").value="";$("part").value="";$("capacity").value="";
 $("raw").textContent="Ready for next chip.";
 $("suggestions").innerHTML="";
 status("Next chip ready. Press SCAN NOW.");
};
$("add").onclick=addRecord;
$("verify").onclick=verifyMouser;
$("export").onclick=exportCSV;
$("undo").onclick=()=>{
 if(!records.length)return;
 records.pop();save();status("Last record removed.");
};
$("clear").onclick=()=>{
 if(confirm("Delete ALL saved scan records?")){
  records=[];save();status("All records cleared.");
 }
};
$("zoom").oninput=e=>{zoomValue=Number(e.target.value)||1};
render();
</script>
</body>
</html>
